# Builds ngp from source, then the plugin, its tests, create-ngp's apps with and without Vite+, the
# playground's Vitest specs and the playground itself, on a clean machine.
# This is the check that the build instructions in docs/building.md work.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Rust, wasm-bindgen and Cargo's build cache all live in toolchain/.cache. Keyed on the
      # pins, so changing versions.env rebuilds from scratch.
      - uses: actions/cache@v4
        with:
          path: |
            toolchain/.cache/rust
            toolchain/.cache/target
          key: ngp-${{ runner.os }}-${{ hashFiles('toolchain/versions.env') }}

      - run: pnpm toolchain

      # The ngp bundle a release ships, with this runner's engine only (publish.yml bundles all four),
      # so toolchain/bundle.mjs can't break between releases. The tests below still use toolchain/out.
      - run: node toolchain/bundle.mjs --host-only

      # The playground's browser-mode project runs its specs in headless Chromium.
      - run: pnpm --filter playground exec playwright install --with-deps chromium

      # Vite+, for create-ngp's tests: they run each scaffolded app again after `vp migrate`, which
      # installs with Vite+'s own pnpm (12 in 1.6.0), the setup a `vp create` user gets. Pinned like
      # any dependency; create-ngp-e2e.yml tries the latest Vite+ every week.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: 1.6.0
          run-install: false
          node-manager: false

      # The plugin's own tests, create-ngp's, then the playground's specs under Vitest, three ways.
      - run: pnpm test

      - run: pnpm playground:build

      # `pnpm test` above also runs the docs check (site/scripts/check-docs.ts). This makes sure the
      # site itself builds and prerenders, so a broken page fails CI before it fails a deploy.
      - run: pnpm site:build
